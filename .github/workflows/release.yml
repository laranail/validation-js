name: "Release"

# A tag push creates or updates the GitHub release, and nothing else. The npm package is NEVER published from a
# tag, because v0.1.0 is a moving tag and a published registry version is immutable: the first push publishes,
# every later move finds the version present and skips, and the registry freezes while the tag goes on moving.
# That is what happened here -- GitHub Packages holds @laranail/validation-js@0.1.0 from an early tag push.
# So the npm package carries its OWN version in package.json and is published by hand:
#     gh workflow run release.yml -f tag=vX.Y.Z -f registry=github      (or .dev/tools/npm-release)
# GitHub Packages (npm.pkg.github.com) needs no npm account: the run's own GITHUB_TOKEN publishes. This repository
# was created after 2026-07-15, so npm's trusted publishing refuses its immutable OIDC subject (npm/cli#9969).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish, e.g. v0.1.0"
        required: true
      registry:
        description: "npm (registry.npmjs.org) or github (GitHub Packages)"
        type: choice
        options: [npm, github]
        default: npm

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only for a tag push: publishing an existing tag by hand leaves its release alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The release body IS the CHANGELOG section for this version — a
      # release without a real description is incomplete (org standard).
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## (\\[)?(v)?"ver"([] ]|$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Two SBOMs, one per registry surface (§12.3): the composer dist via
      # the org's package-tools generator (which reads composer.lock from
      # the app base path — the skeleton under the testbench CLI), and the
      # npm dist via npm's own CycloneDX emitter.
      - name: Generate SBOMs
        run: |
          composer update --prefer-dist --no-interaction --quiet
          cp composer.lock vendor/orchestra/testbench-core/laravel/composer.lock
          vendor/bin/testbench laranail::package-tools.sbom --print > sbom.composer.cdx.json
          php -r 'json_decode(file_get_contents("sbom.composer.cdx.json"), flags: JSON_THROW_ON_ERROR);'
          npm install --silent
          npm sbom --sbom-format cyclonedx --omit dev > sbom.npm.cdx.json
          node -e 'JSON.parse(require("fs").readFileSync("sbom.npm.cdx.json"))'

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.1.0 is a moving tag -- it is force-pushed on every change, so this
          # workflow re-fires against a release that already exists. `gh release
          # create` refuses outright in that case ("a release with the same tag
          # name already exists") and exits 1, so every routine tag move would
          # produce a red run and bury any real release failure.
          #
          # The 26 packages using softprops/action-gh-release already update in
          # place; this is the hand-rolled equivalent. Both SBOMs need explicit
          # re-upload on the edit path: `gh release edit` takes no assets, and
          # the upload needs --clobber because the names are already present.
          #
          # --draft=false is load-bearing, not a restatement of the default. Deleting a tag reverts
          # its release to a DRAFT, and moving v0.1.0 goes through a delete-then-push wherever
          # `git push --force` is unavailable. `gh release edit` leaves the flag exactly as it finds
          # it, so without this the run goes GREEN while republishing nothing: correct tag, invisible
          # release. Measured here on 2026-11-08, and nothing else reports that state -- the tag
          # resolves, composer installs, and verify-tag-currency.sh passes, because none of them
          # reads the release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file release-body.md
            gh release upload "$GITHUB_REF_NAME" \
              sbom.composer.cdx.json sbom.npm.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-body.md \
              --generate-notes \
              sbom.composer.cdx.json sbom.npm.cdx.json
          fi

  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # workflow_dispatch ONLY. A tag push must never reach this job: v0.1.0 moves, a registry version does not,
    # so an automatic publish can only ever fire once and then skip in silence for good. Publishing is a decision
    # a maintainer takes, on the version package.json names -- see the header.
    #
    # NPM_PUBLISH_ENABLED stays as a second switch, so the job can be turned off without editing the workflow.
    # A repository variable is used rather than testing the secret directly: the secrets context is not
    # available in a job-level `if`.
    #
    #     gh variable set NPM_PUBLISH_ENABLED --body true --repo laranail/validation-js
    if: ${{ github.event_name == 'workflow_dispatch' && vars.NPM_PUBLISH_ENABLED == 'true' }}

    # OIDC provenance: configure npm trusted publishing for
    # @laranail/validation-js pointing at this workflow (or provide
    # NPM_TOKEN as a fallback secret).
    permissions:
      contents: read
      id-token: write
      packages: write # GitHub Packages, with the run's GITHUB_TOKEN
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}

    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install

      # There is deliberately NO check that the manifest matches the tag. Requiring them to agree is what froze
      # this package: the tag is permanently v0.1.0, so the manifest could never leave 0.1.0 either, and 0.1.0 is
      # already published and immutable. The tag says which commit to build; package.json says which version to
      # publish, and the two are independent on purpose.
      - name: Say which version will be published
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "publishing @laranail/validation-js@$version from ${TAG} (version from package.json, not the tag)"
          test "v$version" != "$TAG" || echo "::warning::the manifest version equals the tag's; bump package.json before publishing a release"

      # GitHub Packages is reached through its own userconfig, so the .npmrc setup-node wrote for npm is
      # untouched. A version the registry already has is reported rather than failed, so a re-run after a partial
      # publish is safe -- but it is reported as a WARNING, because a run that published nothing must not read as
      # a clean release. That silent skip is what hid the freeze here for two months.
      - name: Check whether this version is already published
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@laranail:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TARGET" = github ]; then
            found=$(npm view "$name@$version" version --userconfig "$RUNNER_TEMP/github-packages.npmrc" 2>/dev/null || true)
            label="GitHub Packages"
          else
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            label=npm
          fi
          if [ "$found" = "$version" ]; then
            echo "::warning::$label already has $name@$version -- nothing was published; a registry version is immutable, so bump package.json to release new code."
            echo "already on $label: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs the full suite + the pack-import check.
      # npm: trusted publishing, or the NPM_TOKEN secret. npm tries OIDC before
      # a token whenever the job can mint one, so the token route hides the
      # OIDC variables and loses provenance. GitHub Packages: the run's token.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            npm publish --userconfig "$RUNNER_TEMP/github-packages.npmrc" --registry https://npm.pkg.github.com --provenance=false
          elif [ -n "$NPM_TOKEN" ]; then
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance=false
          else
            npm publish --provenance --access public
          fi

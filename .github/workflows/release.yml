name: "Release"

# A tag push creates or updates the GitHub release, then publishes the npm package to the registry the
# repository variable PUBLISH_REGISTRY names (npm when unset). A maintainer can publish an existing tag by hand to
# either registry, which is what .dev/tools/npm-release does:  gh workflow run release.yml -f tag=vX.Y.Z -f registry=github
# GitHub Packages (npm.pkg.github.com) needs no npm account: the run's own GITHUB_TOKEN publishes. This repository
# was created after 2026-07-15, so npm's trusted publishing refuses its immutable OIDC subject (npm/cli#9969).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish, e.g. v0.1.0"
        required: true
      registry:
        description: "npm (registry.npmjs.org) or github (GitHub Packages)"
        type: choice
        options: [npm, github]
        default: npm

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only for a tag push: publishing an existing tag by hand leaves its release alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The release body IS the CHANGELOG section for this version — a
      # release without a real description is incomplete (org standard).
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## (\\[)?(v)?"ver"([] ]|$)" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Two SBOMs, one per registry surface (§12.3): the composer dist via
      # the org's package-tools generator (which reads composer.lock from
      # the app base path — the skeleton under the testbench CLI), and the
      # npm dist via npm's own CycloneDX emitter.
      - name: Generate SBOMs
        run: |
          composer update --prefer-dist --no-interaction --quiet
          cp composer.lock vendor/orchestra/testbench-core/laravel/composer.lock
          vendor/bin/testbench laranail::package-tools.sbom --print > sbom.composer.cdx.json
          php -r 'json_decode(file_get_contents("sbom.composer.cdx.json"), flags: JSON_THROW_ON_ERROR);'
          npm install --silent
          npm sbom --sbom-format cyclonedx --omit dev > sbom.npm.cdx.json
          node -e 'JSON.parse(require("fs").readFileSync("sbom.npm.cdx.json"))'

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.1.0 is a moving tag -- it is force-pushed on every change, so this
          # workflow re-fires against a release that already exists. `gh release
          # create` refuses outright in that case ("a release with the same tag
          # name already exists") and exits 1, so every routine tag move would
          # produce a red run and bury any real release failure.
          #
          # The 26 packages using softprops/action-gh-release already update in
          # place; this is the hand-rolled equivalent. Both SBOMs need explicit
          # re-upload on the edit path: `gh release edit` takes no assets, and
          # the upload needs --clobber because the names are already present.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-body.md
            gh release upload "$GITHUB_REF_NAME" \
              sbom.composer.cdx.json sbom.npm.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-body.md \
              --generate-notes \
              sbom.composer.cdx.json sbom.npm.cdx.json
          fi

  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release

    # Gated on a repository variable because the npm side is not configured yet:
    # @laranail/validation-js has never been published, so `npm publish` fails
    # with ENEEDAUTH on every tag move. A workflow that is always red is a
    # workflow nobody reads -- it would bury the next real release failure the
    # same way the "release already exists" error did.
    #
    # To enable: configure npm trusted publishing for @laranail/validation-js
    # pointing at this workflow (or add an NPM_TOKEN secret), then set the
    # repository variable NPM_PUBLISH_ENABLED to 'true'. Until then this job is
    # visibly skipped rather than silently absent.
    #
    #     gh variable set NPM_PUBLISH_ENABLED --body true --repo laranail/validation-js
    #
    # A repository variable is used rather than testing the secret directly:
    # the secrets context is not available in a job-level `if`.
    # A hand-started run has no release job to wait for, so `needs` alone would skip it.
    if: ${{ !cancelled() && vars.NPM_PUBLISH_ENABLED == 'true' && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}

    # OIDC provenance: configure npm trusted publishing for
    # @laranail/validation-js pointing at this workflow (or provide
    # NPM_TOKEN as a fallback secret).
    permissions:
      contents: read
      id-token: write
      packages: write # GitHub Packages, with the run's GITHUB_TOKEN
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.registry || vars.PUBLISH_REGISTRY || 'npm' }}

    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install

      # The tag and the manifest must agree — npm reads the manifest, git
      # reads the tag, and a mismatch ships a version nobody meant.
      - name: Verify manifest matches tag
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          test "v$MANIFEST" = "$TAG" || {
            echo "package.json ($MANIFEST) != tag ($TAG)" >&2
            exit 1
          }

      # GitHub Packages is reached through its own userconfig, so the .npmrc
      # setup-node wrote for npm is untouched. A version the registry already
      # has is reported, not failed: v0.1.0 is a moving tag.
      - name: Check whether this version is already published
        id: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@laranail:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/github-packages.npmrc"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TARGET" = github ]; then
            found=$(npm view "$name@$version" version --userconfig "$RUNNER_TEMP/github-packages.npmrc" 2>/dev/null || true)
            label="GitHub Packages"
          else
            found=$(npm view "$name@$version" version 2>/dev/null || true)
            label=npm
          fi
          if [ "$found" = "$version" ]; then
            echo "already on $label: $name@$version"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs the full suite + the pack-import check.
      # npm: trusted publishing, or the NPM_TOKEN secret. npm tries OIDC before
      # a token whenever the job can mint one, so the token route hides the
      # OIDC variables and loses provenance. GitHub Packages: the run's token.
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            npm publish --userconfig "$RUNNER_TEMP/github-packages.npmrc" --registry https://npm.pkg.github.com --provenance=false
          elif [ -n "$NPM_TOKEN" ]; then
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance=false
          else
            npm publish --provenance --access public
          fi

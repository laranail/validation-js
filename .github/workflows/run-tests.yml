name: run-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # fileinfo is required by league/flysystem-local, which
          # laravel/framework pulls in. Linux images ship it; the Windows PHP
          # build does not unless asked, so composer could not resolve at all
          # and every Windows cell failed while every Linux one passed.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: none
      # laranail/validation is PHP ^8.5. It is a DEV dependency used only by the
      # exporter/parity tests, which skip themselves when it is absent -- the
      # package's own src/ guards it with interface_exists(). Removing it here
      # keeps the 8.4 cell honest rather than dropping 8.4 from the matrix.
      - name: Drop the 8.5-only dependency on PHP 8.4
        if: matrix.php == '8.4'
        run: composer remove --dev laranail/validation --no-update

      - run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction
      - run: vendor/bin/pest

  js:
    runs-on: ubuntu-latest
    name: JavaScript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # The library has zero runtime dependencies; the install brings only
      # dev tooling (TypeScript, Biome, Stryker).
      - run: npm install
      # npm test runs the strict typecheck first, then the suite — published
      # declarations were provably unsound while nothing ran tsc.
      - run: npm test
      - run: npm run format:check
      # The unit suite runs the raw sources — it stayed green while the
      # PUBLISHED package could not be imported at all (`main` pointed at a
      # .ts file). This packs the tarball exactly as `npm publish` would,
      # installs it into a clean project, and imports it under plain Node.
      - run: npm run test:pack
      # The §9 non-functional gate: the engine stays small and each layer
      # separately importable; a size regression fails here, not in review.
      - run: npm run budget

  browser:
    runs-on: ubuntu-latest
    name: Browser runtime (Playwright)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # Real browsers, real forms: modes, debounce, the stale-response
      # race, renderer presets, resolver placement, axe assertions, and
      # the two-forms / StrictMode / leak-free-destroy guarantees.
      - run: npm run test:e2e

  parity:
    runs-on: ubuntu-latest
    name: Parity fixture is current
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # 8.5, deliberately: the dev constraint is dual-range so the 8.4
          # matrix cells stay resolvable, but the CURRENCY check must track
          # the live ^1.0 line of laranail/validation — on 8.4 it would
          # resolve the frozen 0.1 line and silently stop noticing drift.
          php-version: '8.5'
          # fileinfo is required by league/flysystem-local, which
          # laravel/framework pulls in. Linux images ship it; the Windows PHP
          # build does not unless asked, so composer could not resolve at all
          # and every Windows cell failed while every Linux one passed.
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: composer update --prefer-dist --no-interaction
      # Regenerate from Laravel's own verdicts, then fail if the committed
      # fixture disagrees. Without this the fixture silently rots and the
      # parity claim becomes a claim about a snapshot of a past Laravel.
      - run: vendor/bin/pest --filter=ParityFixture
      - run: git diff --exit-code js/tests/fixtures/parity.json
      # Replay the regenerated fixtures with ZERO node_modules — the
      # engine's zero-dependency property, exercised for real. Only the
      # parity replay runs here; the js job runs the full suite (the Vue
      # adapter test needs its dev-dependency peer installed).
      - run: node --test js/tests/parity.test.ts

name: mutation

# Mutation testing is minutes-per-run, so it guards on a weekly cadence
# and on demand rather than on every PR — the unit/parity suites stay
# the per-commit gate; this is the deeper audit of THOSE suites' teeth.
on:
  workflow_dispatch:
  schedule:
    - cron: "39 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install

      - run: npm run test:mutation

name: mutation

# Mutation testing is minutes-per-run, so it guards on a weekly cadence
# and on demand rather than on every PR — the unit/parity suites stay
# the per-commit gate; this is the deeper audit of THOSE suites' teeth.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm install

      - run: npm run test:mutation

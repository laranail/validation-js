name: mutation

# Mutation testing is minutes-per-run, so it guards on a weekly cadence
# and on demand rather than on every PR — the unit/parity suites stay
# the per-commit gate; this is the deeper audit of THOSE suites' teeth.
on:
  workflow_dispatch:
  schedule:
    - cron: "39 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    # Stryker needs about 27 minutes for the ~1,700 mutants (measured on the
    # 2026-10-26 run, cancelled at 58% after 15). The bound is there to stop a
    # hung job, not to cut a working one short; 45 leaves headroom for growth.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No lock file is committed (library rule), so every run resolves fresh and
      # can land in the seconds between npm listing a new version and serving its
      # tarball. That failed the confirmation run of 2026-11-02 on @babel/types.
      # Three attempts, a minute apart, each logged; the third failure is real.
      - name: Install dependencies (up to 3 attempts)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm install: attempt ${attempt} of 3"
            if npm install; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "::warning::npm install failed on attempt ${attempt}; retrying in 60 s"
              sleep 60
            fi
          done
          echo "::error::npm install failed 3 times"
          exit 1

      - run: npm run test:mutation

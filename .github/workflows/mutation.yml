name: mutation

# Mutation testing is minutes-per-run, so it guards on a weekly cadence
# and on demand rather than on every PR — the unit/parity suites stay
# the per-commit gate; this is the deeper audit of THOSE suites' teeth.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: npm install

      - run: npm run test:mutation
